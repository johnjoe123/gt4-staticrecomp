[package]
name = "gt4net"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GT4Recomp LAN-over-internet: lobby and relay server, and the bridge between the game and a lobby"
rust-version = "1.92"

[[bin]]
name = "gt4net"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
